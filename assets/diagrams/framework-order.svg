<text x="430" y="1326" class="link" text-anchor="start">Dimerco 入出库与序列号</text>
</a>
<a href="https://frame.work/blog/now-in-stock-and-how-a-framework-laptop-gets-from-the-factory-to-you/" target="_blank">
<text x="870" y="1326" class="link" text-anchor="start">历史跨境运输方案</text>
</a>
<a href="https://frame.work/terms-of-sale" target="_blank">
<text x="1260" y="1326" class="link" text-anchor="start">现行销售条款</text>
</a>
</svg>
