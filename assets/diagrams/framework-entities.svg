<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1420" viewBox="0 0 1700 1420" role="img" aria-labelledby="title" xml:lang="zh-CN"><title id="title">06  法律主体、合同、资金与货物怎样对应</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#66817b"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#29443e}.title{font-size:44px;font-weight:700}.sub{font-size:20px;fill:#526c64}.h{font-size:24px;font-weight:700}.b{font-size:18px}.sm{font-size:16px;fill:#516b63}.label{font-size:18px;font-weight:700}.white{fill:white}</style>
<rect x="0" y="0" width="1700" height="1420" rx="0" fill="#f5f8f5" stroke="#d2dfd8"/>
<text x="52" y="75" class="title" text-anchor="start">06  法律主体、合同、资金与货物怎样对应</text>
<text x="52" y="118" class="sub" text-anchor="start">教学基线 · 主要经营公司 A 采购并销售产品，外部工厂 B 制造 · 实际主体须按市场与交易文件核实</text>
<rect x="52" y="170" width="440" height="163" rx="13" fill="#f4eddf" stroke="#d2dfd8"/>
<text x="72" y="207" class="h" text-anchor="start">股东／投资人</text>
<text x="72" y="245" class="b" text-anchor="start">向经营主体投入资本，取得相应权益。</text>
<text x="72" y="279" class="sm" text-anchor="start">董事会和经营层依章程、授权履行职责。</text>
<rect x="625" y="170" width="450" height="163" rx="13" fill="#265b49" stroke="#d2dfd8"/>
<text x="647" y="207" class="h white" text-anchor="start">主要经营公司 A</text>
<text x="647" y="245" class="b white" text-anchor="start">本例承接采购、销售和客户义务。</text>
<text x="647" y="279" class="sm white" text-anchor="start">产品、存货及收入成本按真实业务核算。</text>
<rect x="1208" y="170" width="440" height="163" rx="13" fill="#edf0f6" stroke="#d2dfd8"/>
<text x="1228" y="207" class="h" text-anchor="start">可选的境外经营主体</text>
<text x="1228" y="245" class="b" text-anchor="start">有当地人员、库存、销售或其他需要时，</text>
<text x="1228" y="279" class="sm" text-anchor="start">评估设立或登记方案，并明确承担的业务。</text>
<path d="M492 244 H615" stroke="#66817b" stroke-width="2.2" fill="none" marker-end="url(#a)"/>
<text x="557" y="227" class="sm" text-anchor="middle">出资</text>
<path d="M1075 244 H1198" stroke="#66817b" stroke-width="2.2" fill="none" marker-end="url(#a)" stroke-dasharray="7 5"/>
<text x="1141" y="227" class="sm" text-anchor="middle">按需设计</text>
<path d="M850 333 V378 M277 418 V378 H1423 V418 M850 378 V418" stroke="#66817b" stroke-width="2.2" fill="none"/>
<rect x="52" y="418" width="440" height="207" rx="13" fill="#fff" stroke="#d2dfd8"/>
<text x="69" y="454" class="h" text-anchor="start">A ↔ 客户</text>
<text x="69" y="486" class="label" text-anchor="start">销售合同／网站订单</text>
<text x="69" y="526" class="sm" text-anchor="start">配置、价格、交期、取消与售后约定。</text>
<text x="69" y="558" class="sm" text-anchor="start">客户按约付款，A 承担相应销售义务。</text>
<text x="69" y="590" class="sm" text-anchor="start">谁开票、收款、退款要与文件对应。</text>
<rect x="625" y="418" width="440" height="207" rx="13" fill="#fff" stroke="#d2dfd8"/>
<text x="642" y="454" class="h" text-anchor="start">A ↔ 工厂 B</text>
<text x="642" y="486" class="label" text-anchor="start">采购或委托制造安排</text>
<text x="642" y="526" class="sm" text-anchor="start">规格、数量、价格、验收及付款条件。</text>
<text x="642" y="558" class="sm" text-anchor="start">A 按约采购并支付制造或产品款项。</text>
<text x="642" y="590" class="sm" text-anchor="start">物料和成品归属、返工费用需要约定。</text>
<rect x="1208" y="418" width="440" height="207" rx="13" fill="#fff" stroke="#d2dfd8"/>
<text x="1225" y="454" class="h" text-anchor="start">A ↔ 仓配／物流等</text>
<text x="1225" y="486" class="label" text-anchor="start">各类服务合同</text>
<text x="1225" y="526" class="sm" text-anchor="start">仓储、运输、报关、检测等服务范围。</text>
<text x="1225" y="558" class="sm" text-anchor="start">委托方按约支付服务费用。</text>
<text x="1225" y="590" class="sm" text-anchor="start">保管货物与拥有货物分别核对。</text>
<text x="52" y="675" class="h" text-anchor="start">把每个“身份”落到具体法人上</text>
<rect x="52" y="695" width="1596" height="45" rx="13" fill="#dfece6" stroke="#d2dfd8"/>
<text x="70" y="725" class="label" text-anchor="start">主体身份</text>
<text x="380" y="725" class="label" text-anchor="start">本例怎样安排</text>
<text x="1080" y="725" class="label" text-anchor="start">用什么材料核对</text>
<rect x="52" y="747" width="1596" height="45" rx="6" fill="#fff" stroke="#d2dfd8"/>
<text x="70" y="776" class="sm" text-anchor="start">对客销售方</text>
<text x="380" y="776" class="sm" text-anchor="start">本例为经营公司 A；不同市场可由其他主体销售。</text>
<text x="1080" y="776" class="sm" text-anchor="start">销售条款、订单、发票、退款安排</text>
<rect x="52" y="798" width="1596" height="45" rx="6" fill="#edf2f0" stroke="#d2dfd8"/>
<text x="70" y="827" class="sm" text-anchor="start">采购／制造委托方</text>
<text x="380" y="827" class="sm" text-anchor="start">本例为 A；具体下单方和付款方需能解释其关系。</text>
<text x="1080" y="827" class="sm" text-anchor="start">采购合同、订单、付款及验收记录</text>
<rect x="52" y="849" width="1596" height="45" rx="6" fill="#fff" stroke="#d2dfd8"/>
<text x="70" y="878" class="sm" text-anchor="start">成品库存持有方</text>
<text x="380" y="878" class="sm" text-anchor="start">本例假设 A 持有；在工厂、仓库或在途时分别确认。</text>
<text x="1080" y="878" class="sm" text-anchor="start">合同货权约定、收货及库存记录</text>
<rect x="52" y="900" width="1596" height="45" rx="6" fill="#edf2f0" stroke="#d2dfd8"/>
<text x="70" y="929" class="sm" text-anchor="start">研发及知识产权主体</text>
<text x="380" y="929" class="sm" text-anchor="start">由研发、雇佣或合作协议明确归属和许可。</text>
<text x="1080" y="929" class="sm" text-anchor="start">研发协议、知识产权文件、授权协议</text>
<rect x="52" y="951" width="1596" height="45" rx="6" fill="#fff" stroke="#d2dfd8"/>
<text x="70" y="980" class="sm" text-anchor="start">出口／进口主体</text>
<text x="380" y="980" class="sm" text-anchor="start">依各段实际申报和适用规则明确；DDP 字样不足以具名。</text>
<text x="1080" y="980" class="sm" text-anchor="start">申报资料、授权文件、进口安排</text>
<rect x="52" y="1002" width="1596" height="45" rx="6" fill="#edf2f0" stroke="#d2dfd8"/>
<text x="70" y="1031" class="sm" text-anchor="start">收款／服务结算主体</text>
<text x="380" y="1031" class="sm" text-anchor="start">核对合同收款方与银行或受托支付渠道。</text>
<text x="1080" y="1031" class="sm" text-anchor="start">收款账户、支付协议、结算与对账记录</text>
<rect x="52" y="1053" width="1596" height="45" rx="6" fill="#fff" stroke="#d2dfd8"/>
<text x="70" y="1082" class="sm" text-anchor="start">雇佣主体</text>
<text x="380" y="1082" class="sm" text-anchor="start">员工与承担其用工义务的主体签约。</text>
<text x="1080" y="1082" class="sm" text-anchor="start">劳动合同、薪酬及当地用工记录</text>
<rect x="52" y="1124" width="1596" height="141" rx="13" fill="#f4ecdc" stroke="#d2dfd8"/>
<text x="72" y="1160" class="h" text-anchor="start">主体增加之前，先回答</text>
<text x="390" y="1160" class="b" text-anchor="start">要在当地卖货、雇人、持有库存或办理进口吗？谁实际承担这些义务？</text>
<text x="390" y="1195" class="b" text-anchor="start">这个主体获得哪些收入、承担哪些成本？母子公司之间有什么采购、服务或资金交易？</text>
<text x="390" y="1230" class="sm" text-anchor="start">具体设立、税务、海关与用工安排，结合目标市场交由专业人员核实。</text>
<text x="52" y="1307" class="label" text-anchor="start">两条线分别画：股权线说明谁拥有公司；业务合同线说明谁向谁买、卖或提供服务。</text>
<text x="52" y="1341" class="sm" text-anchor="start">部门、公司、仓库运营方可以存在不同对应关系。发货地点、注册地点和收款地点也要分别查证。</text>
<text x="52" y="1373" class="sm" text-anchor="start">这是设计练习，未把上述主体安排当作 Framework 的实际集团架构。</text>
</svg>
