<text x="592" y="1114" class="link" text-anchor="start">Compal 生产与量产验证</text>
</a>
<a href="https://lp.dimerco.com/hubfs/Case%20Studies/Framework%20Case%20Study.pdf" target="_blank">
<text x="1132" y="1114" class="link" text-anchor="start">Dimerco 仓配案例</text>
</a>
<a href="https://frame.work/blog/now-in-stock-and-how-a-framework-laptop-gets-from-the-factory-to-you/" target="_blank">
<text x="52" y="1143" class="link" text-anchor="start">官方跨境运输说明（2022）</text>
</a>
<a href="https://frame.work/terms-of-sale" target="_blank">
<text x="592" y="1143" class="link" text-anchor="start">预订、收款与交货条款（2026）</text>
</a>
<a href="https://frame.work/blog/frameworks-series-a-1-and-community-participation" target="_blank">
<text x="1132" y="1143" class="link" text-anchor="start">2024 年融资公告</text>
</a>
<text x="52" y="1185" class="note" text-anchor="start">证据边界：图据不同年份的公开产品、合作及条款资料整理，展示已披露的业务机制；一笔客户订单的生产和运输为教学串联。</text>
<text x="52" y="1213" class="note" text-anchor="start">合作方报价、具体供应商账期、获客成本和公司净利润尚未取得。2022 年的跨境集运做法按历史案例使用。</text>
<text x="52" y="1241" class="note" text-anchor="start">企业阶段：官方称 2020 年开始创业，2021 年首次交付 Laptop 13；后续已扩展为多条产品线。</text>
</svg>
